name: Check pick sheet

# Run by hand to check that the pick sheet's web app answers: Actions > Check pick sheet > Run workflow.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Web app URL (leave empty to use picksApi from config.json)"
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the URL
        id: url
        env:
          INPUT_URL: ${{ inputs.url }}
        run: |
          u="$INPUT_URL"
          [ -n "$u" ] || u=$(python3 -c "import json; print(json.load(open('config.json')).get('picksApi', ''))")
          [ -n "$u" ] || { echo "No URL given and picksApi is empty"; exit 1; }
          echo "url=$u" >> "$GITHUB_OUTPUT"
      - name: Slate
        run: curl -sSL --max-time 60 "${{ steps.url.outputs.url }}?action=slate" | python3 -m json.tool | head -c 4000
      - name: Self-test
        run: curl -sSL --max-time 60 "${{ steps.url.outputs.url }}?action=selftest" | python3 -m json.tool
      - name: Dry-run submit (nothing is saved)
        run: |
          python3 - > body.json <<'PY'
          import json
          picks = [{"n": n, "pick": "home"} for n in range(1, 9)] + [{"n": n, "pick": "over"} for n in range(1, 8)]
          print(json.dumps({"action": "submit", "dryRun": True, "week": 8, "name": "Losing Hair Do Care", "picks": picks}))
          PY
          curl -sSL --max-time 60 -D headers.txt -H "Origin: https://wintz320.github.io" -H "Content-Type: text/plain;charset=utf-8" \
            --data @body.json "${{ steps.url.outputs.url }}" -o reply.json
          echo "--- final response headers"; grep -iE "^(HTTP|access-control-allow-origin|content-type)" headers.txt
          echo "--- reply"; python3 -m json.tool reply.json
